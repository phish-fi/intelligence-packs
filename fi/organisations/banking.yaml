    name: OP
    category: bank
    domains:
      - domain: op.fi
        relationship: owned
        source: site-op
      - domain: osuuspankki.fi
        relationship: owned
        source: site-osuuspankki-fi
    aliases:
      - value: OP
      - value: OP-ryhmä
      - value: OP Financial Group
      - value: OP Pankki
        match: token_stem
      - value: OP Asiakaspalvelu
      - value: OP-Pohjola
      - value: Osuuspankki
        match: token_stem
      - value: op.fi
      - value: OP-mobiili
        kind: auth_product
      - value: Pohjola
        weight: low
    threatCategories:
      - credential_theft.online_banking
      - authentication_abuse.code_theft
      - authentication_abuse.approval
