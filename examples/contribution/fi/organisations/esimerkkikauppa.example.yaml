# Example contribution: one new organisation in the Finnish pack.
# Copy this file to fi/organisations/<primary domain>.yaml and replace every
# value. The file name is the organisation's id, so it must be its primary
# domain. The organisation and its address are made up (.example is a reserved
# top-level domain); nothing here is real.
# Every value is explained in CONTRIBUTING.md.

name: Esimerkkikauppa
category: retail                       # what scammers pretend to be; the list is in CONTRIBUTING.md
domains:                               # registrable domains only; subdomains are covered automatically
  - domain: esimerkkikauppa.example    # the first domain is the primary one
    evidence: https://www.esimerkkikauppa.example/   # public page that shows the domain is the organisation's
    checked: 2026-11-12                # the day you opened that page
    says: Esimerkkikauppa's own website
  - domain: esimerkki-verkkokauppa.example
    evidence: https://www.esimerkkikauppa.example/tietoa-meista
    checked: 2026-11-12
    says: The company page names esimerkki-verkkokauppa.example as its online shop
aliases:                               # other names people and scammers use for it
  - Esimerkkikauppa Oy                 # the organisation's name is added automatically
reportTo:                              # where phishing reports go
  - email: abuse@esimerkkikauppa.example
    evidence: https://www.esimerkkikauppa.example/turvallisuus/huijaukset   # must be a different page from the domain evidence
    checked: 2026-11-12
    says: Security page asks customers to report scams to this address
