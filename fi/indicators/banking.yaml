    window: 1
    purpose: identify
    threatCategories:
      - credential_theft.online_banking
    role: supporting
    weight: low
    expectedMatching: URL path or anchor 'auth', 'authenticate', 'identify', Swedish 'identifiera dig'.
    falsePositiveRisks: Generic SSO paths contain 'auth'; meaningful only with a sender claim or flow.
    sources:
