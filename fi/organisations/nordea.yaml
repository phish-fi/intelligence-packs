# The source ids below are declared in ../pack.yaml.
name: Nordea
category: bank
domains:
  - domain: nordea.fi
    source: site-nordea
  - domain: nordea.com
    source: site-nordea
  - domain: nordea.se
    source: site-nordea-se
  - domain: nordea.dk
    source: site-nordea-dk
  - domain: nordea.no
    source: site-nordea-no
aliases:
  - value: Nordea
    match: token_stem
  - value: Nordea Pankki
    match: token_stem
  - value: Nordea ID
    kind: auth_product
  - value: Nordea Codes
    kind: auth_product
    weight: low
threatCategories:
  - credential_theft.online_banking
  - authentication_abuse.code_theft
  - authentication_abuse.approval
communicationPolicy:
  channel: email
  neverContains:
    - link_login
    - link_identify
    - link_payment
    - link_credential_update
  source: owner-2026-10-28
reportTo:
  - email: huijaushavainnot@nordea.fi
    id: nordea.phishing_report_fi
    source: nordea-scam-report
    localizedNames:
      fi: Nordean huijaushavainnot
      sv: Nordeas bedrägerirapporter
    payload: original_required
    acceptsAutomatedReports: true
    threatCategories:
      - phishing
      - brand_impersonation
      - credential_theft
      - credential_theft.online_banking
      - authentication_abuse
      - authentication_abuse.code_theft
      - authentication_abuse.approval
      - payment_card_theft
    publicSourceUrl: https://www.nordea.fi/henkiloasiakkaat/sinun-elamasi/turvallisuus/
    scope:
      identificationSystemAny:
        - fi.bank_eid
