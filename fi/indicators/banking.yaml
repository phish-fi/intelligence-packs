# Indicators (from v1 pack fi.banking).
# Converted from the v1 packs by scripts/packs-convert-v2.ts; edit this file, not the v1 JSON.
indicators:
  - id: fi.banking.link_purpose.login_fi
    type: link_purpose
    lang: fi
    tokens:
      - kirjaudu~|kirjautu~|sisäänkirjau~
    window: 1
    purpose: login
    threatCategories:
      - credential_theft.online_banking
    role: supporting
    weight: low
    expectedMatching: "Anchor or URL path asking to log in: 'Kirjaudu verkkopankkiin', 'kirjautumaan', '/kirjaudu'."
    falsePositiveRisks: Legitimate service mail links to 'Kirjaudu' on its own site; that is why this is only a link purpose, used by the policy and identification rules, never a verdict on its own.
    sources:
      - owner-2026-10-28
    tests:
      match:
        - "Kirjaudu verkkopankkiin"
        - "Siirry kirjautumaan"
      noMatch:
        - "Lue lisää palvelustamme"
  - id: fi.banking.link_purpose.login_url
    type: link_purpose
    lang: en
    tokens:
      - login|signin|sign-in|logon
    window: 1
    purpose: login
    threatCategories:
      - credential_theft.online_banking
    role: supporting
    weight: low
    expectedMatching: URL path or anchor words 'login', 'signin', 'sign-in', 'logon', e.g. https://host.example/fi/login.
    falsePositiveRisks: Many legitimate sites use /login paths; meaningful only together with a bank sender claim or an identification flow.
    sources:
      - owner-2026-10-28
    tests:
      match:
        - "Login"
        - "Sign-in"
      noMatch:
        - "Read more"
  - id: fi.banking.link_purpose.login_en_sv
    type: link_purpose
    lang: en
    tokens:
      - log|sign|logga
      - in|on
    window: 2
    purpose: login
