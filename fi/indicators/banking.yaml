      - credential_theft.online_banking
    role: supporting
    weight: low
    expectedMatching: Anchor text 'Log in', 'Sign in', 'Logga in'.
    falsePositiveRisks: Same as login_url.
    sources:
      - owner-2026-10-28
    tests:
      match:
        - "Log in"
        - "Logga in"
      noMatch:
        - "Read the newsletter"
  - id: fi.banking.link_purpose.identify_fi
    type: link_purpose
    lang: fi
    tokens:
      - tunnistau~|tunnistus~|tunnistaut~|identifioi~
