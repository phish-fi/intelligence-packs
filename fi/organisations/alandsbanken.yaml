name: Ålandsbanken
category: bank
domains:
  - domain: alandsbanken.fi
    source: site-alandsbanken
  - domain: alandsbanken.ax
    source: site-alandsbanken-ax
  - domain: alandsbanken.se
    source: site-alandsbanken-se
  - domain: alandsbanken.com
    source: site-alandsbanken-com
aliases:
  - value: Ålandsbanken
    match: token_stem
  - value: Alandsbanken
    match: token_stem
threatCategories:
  - credential_theft.online_banking
  - authentication_abuse.code_theft
  - authentication_abuse.approval
reportTo:
  - email: asiakaspalvelu@alandsbanken.fi
    evidence: https://www.alandsbanken.fi/turvallisuus
    checked: 2026-11-22
    says: Ålandsbanken asks people to email suspicious messages and website addresses claiming to be from the bank.
    publicSourceUrl: https://www.alandsbanken.fi/turvallisuus
communicationPolicy:
  channel: email
  neverContains:
    - link_login
    - link_identify
    - link_payment
    - link_credential_update
  source: owner-2026-10-28
