    tests:
      match:
        - "Sinun tulee tunnistautua palveluun pankkitunnuksilla."
        - "Tunnistus vaaditaan ennen kuin voit jatkaa."
      noMatch:
        - "Kiitos tilauksestasi, toimitamme paketin pian."
  - id: fi.banking.phrase.strong_identification
