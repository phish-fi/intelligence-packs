# Where Finnish phishing reports go. Addresses rest on the owner's confirmation until a public source is added (§10).
# Converted from the v1 packs by scripts/packs-convert-v2.ts; edit this file, not the v1 JSON.
destinations:
  - id: op.phishing_report_fi
    kind: organisation
    organisation: op
    name: OP phishing reports
    localizedNames:
      fi: OP:n huijaushavainnot
      sv: OP:s bedrägerirapporter
    email: huijaushavainnot@op.fi
    source: owner-2026-10-28-bank-intake
    acceptsAutomatedReports: true
    payload: original_required
    threatCategories:
      - phishing
      - brand_impersonation
      - credential_theft
      - credential_theft.online_banking
      - authentication_abuse
      - authentication_abuse.code_theft
      - authentication_abuse.approval
      - payment_card_theft
    scope:
      identificationSystemAny:
        - fi.bank_eid
